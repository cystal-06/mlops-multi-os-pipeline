#!/usr/sbin/nft -f

flush ruleset

table inet filter {
    set ssh_meter {
        type ipv4_addr
        flags dynamic, timeout
        timeout 1m
        size 65535
    }

    chain input {
        type filter hook input priority filter; policy drop;

        ct state established,related accept
        ct state invalid drop

        iifname "lo" accept

        ip protocol icmp icmp type echo-request limit rate 5/second accept
        ip6 nexthdr icmpv6 icmpv6 type { echo-request, nd-neighbor-solicit, nd-neighbor-advert, nd-router-advert } accept

        tcp dport 2222 update @ssh_meter { ip saddr limit rate over 4/minute } drop
        tcp dport 2222 accept

        tcp dport { 8080, 8000, 5000, 3000, 9001 } accept
    }

    chain forward {
        type filter hook forward priority filter; policy drop;
    }

    chain output {
        type filter hook output priority filter; policy accept;
    }
}
