services:
  postgres:
    image: postgres:15-alpine
    container_name: mlops-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mlops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secure_postgres_password_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-mlflow_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - mlops-backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mlops} -d ${POSTGRES_DB:-mlflow_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-01-18T22-51-28Z
    container_name: mlops-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-secure_minio_password_change_me}
    volumes:
      - minio_data:/data
    networks:
      - mlops-backend
      - mlops-frontend
    ports:
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:RELEASE.2024-01-18T22-49-14Z
    container_name: mlops-minio-init
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - mlops-backend
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-secure_minio_password_change_me};
      /usr/bin/mc mb myminio/${MLFLOW_BUCKET_NAME:-mlflow-artifacts} --ignore-existing;
      exit 0;
      "

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.10.2
    container_name: mlops-mlflow
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-secure_minio_password_change_me}
    command: >
      mlflow server
      --backend-store-uri postgresql://${POSTGRES_USER:-mlops}:${POSTGRES_PASSWORD:-secure_postgres_password_change_me}@postgres:5432/${POSTGRES_DB:-mlflow_db}
      --default-artifact-root s3://${MLFLOW_BUCKET_NAME:-mlflow-artifacts}/
      --host 0.0.0.0
      --port 5000
    networks:
      - mlops-backend
      - mlops-frontend
    ports:
      - "${MLFLOW_PORT:-5000}:5000"

  fastapi:
    build:
      context: ./fastapi
      dockerfile: Dockerfile
    container_name: mlops-fastapi
    restart: unless-stopped
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-secure_minio_password_change_me}
    networks:
      - mlops-backend
      - mlops-frontend
    ports:
      - "${FASTAPI_PORT:-8080}:8000"

  prometheus:
    image: prom/prometheus:v2.49.1
    container_name: mlops-prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - mlops-frontend
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"

  grafana:
    image: grafana/grafana:10.3.1
    container_name: mlops-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: false
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - mlops-frontend
    ports:
      - "${GRAFANA_PORT:-3000}:3000"

  node-exporter:
    image: prom/node-exporter:v1.7.0
    container_name: mlops-node-exporter
    restart: unless-stopped
    networks:
      - mlops-frontend
    ports:
      - "${NODE_EXPORTER_PORT:-9100}:9100"

networks:
  mlops-frontend:
    driver: bridge
  mlops-backend:
    driver: bridge
    internal: true

volumes:
  postgres_data:
  minio_data:
