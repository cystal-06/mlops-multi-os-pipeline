<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#EDF2F7"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284C7"/>
    </marker>
    <marker id="arrowReturn" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10B981"/>
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" rx="16" stroke="#CBD5E1" stroke-width="2"/>

  <!-- Title Banner -->
  <rect x="250" y="24" width="700" height="42" rx="21" fill="#002060" filter="url(#shadow)"/>
  <text x="600" y="51" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">
    CHU TRÌNH VÒNG ĐỜI MLOPS KHÉP KÍN (CLOSED-LOOP MLOPS LIFECYCLE)
  </text>

  <!-- ================= TOP ROW: 3 STEPS ================= -->

  <!-- STEP 1: Data Pipeline -->
  <g transform="translate(60, 100)" filter="url(#shadow)">
    <rect width="300" height="135" rx="12" fill="#FFFFFF" stroke="#0284C7" stroke-width="2"/>
    <rect x="0" y="0" width="300" height="36" rx="12" fill="#0284C7"/>
    <rect x="0" y="24" width="300" height="12" fill="#0284C7"/>
    <circle cx="24" cy="18" r="10" fill="#FFFFFF"/>
    <text x="24" y="23" font-family="Segoe UI, Arial" font-size="12" font-weight="bold" fill="#0284C7" text-anchor="middle">1</text>
    <text x="45" y="23" font-family="Segoe UI, Arial" font-size="14" font-weight="bold" fill="#FFFFFF">DATA PIPELINE</text>
    <text x="150" y="70" font-family="Segoe UI, Arial" font-size="13" font-weight="bold" fill="#0F172A" text-anchor="middle">Thu thập &amp; Tiền xử lý dữ liệu</text>
    <text x="150" y="94" font-family="Segoe UI, Arial" font-size="12" fill="#64748B" text-anchor="middle">• Raw Data Ingestion &amp; Labeling</text>
    <text x="150" y="114" font-family="Segoe UI, Arial" font-size="12" fill="#64748B" text-anchor="middle">• Image Augmentation (OCR Images)</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <path d="M 370 167 L 438 167" fill="none" stroke="#0284C7" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- STEP 2: Model Training -->
  <g transform="translate(450, 100)" filter="url(#shadow)">
    <rect width="300" height="135" rx="12" fill="#FFFFFF" stroke="#6366F1" stroke-width="2"/>
    <rect x="0" y="0" width="300" height="36" rx="12" fill="#6366F1"/>
    <rect x="0" y="24" width="300" height="12" fill="#6366F1"/>
    <circle cx="24" cy="18" r="10" fill="#FFFFFF"/>
    <text x="24" y="23" font-family="Segoe UI, Arial" font-size="12" font-weight="bold" fill="#6366F1" text-anchor="middle">2</text>
    <text x="45" y="23" font-family="Segoe UI, Arial" font-size="14" font-weight="bold" fill="#FFFFFF">MODEL TRAINING</text>
    <text x="150" y="70" font-family="Segoe UI, Arial" font-size="13" font-weight="bold" fill="#0F172A" text-anchor="middle">Huấn luyện &amp; Tối ưu tham số</text>
    <text x="150" y="94" font-family="Segoe UI, Arial" font-size="12" fill="#64748B" text-anchor="middle">• Hyperparameter Fine-Tuning</text>
    <text x="150" y="114" font-family="Segoe UI, Arial" font-size="12" fill="#64748B" text-anchor="middle">• Tesseract-OCR LSTM Training</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <path d="M 760 167 L 828 167" fill="none" stroke="#0284C7" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- STEP 3: Tracking Server -->
  <g transform="translate(840, 100)" filter="url(#shadow)">
    <rect width="300" height="135" rx="12" fill="#FFFFFF" stroke="#0EA5E9" stroke-width="2"/>
    <rect x="0" y="0" width="300" height="36" rx="12" fill="#0EA5E9"/>
    <rect x="0" y="24" width="300" height="12" fill="#0EA5E9"/>
    <circle cx="24" cy="18" r="10" fill="#FFFFFF"/>
    <text x="24" y="23" font-family="Segoe UI, Arial" font-size="12" font-weight="bold" fill="#0EA5E9" text-anchor="middle">3</text>
    <text x="45" y="23" font-family="Segoe UI, Arial" font-size="14" font-weight="bold" fill="#FFFFFF">TRACKING SERVER</text>
    <text x="150" y="70" font-family="Segoe UI, Arial" font-size="13" font-weight="bold" fill="#0F172A" text-anchor="middle">Quản lý thực nghiệm MLflow</text>
    <text x="150" y="94" font-family="Segoe UI, Arial" font-size="12" fill="#64748B" text-anchor="middle">• Log Metrics, Params &amp; Runs</text>
    <text x="150" y="114" font-family="Segoe UI, Arial" font-size="12" fill="#64748B" text-anchor="middle">• PostgreSQL Database Backend</text>
  </g>

  <!-- ================= CONNECTOR TOP -> BOTTOM ================= -->
  <!-- Arrow 3 -> 4 (Down) -->
  <path d="M 990 245 L 990 288" fill="none" stroke="#0284C7" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- ================= BOTTOM ROW: 3 STEPS ================= -->

  <!-- STEP 4: Artifact Store -->
  <g transform="translate(840, 300)" filter="url(#shadow)">
    <rect width="300" height="135" rx="12" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2"/>
    <rect x="0" y="0" width="300" height="36" rx="12" fill="#F59E0B"/>
    <rect x="0" y="24" width="300" height="12" fill="#F59E0B"/>
    <circle cx="24" cy="18" r="10" fill="#FFFFFF"/>
    <text x="24" y="23" font-family="Segoe UI, Arial" font-size="12" font-weight="bold" fill="#F59E0B" text-anchor="middle">4</text>
    <text x="45" y="23" font-family="Segoe UI, Arial" font-size="14" font-weight="bold" fill="#FFFFFF">ARTIFACT STORE</text>
    <text x="150" y="70" font-family="Segoe UI, Arial" font-size="13" font-weight="bold" fill="#0F172A" text-anchor="middle">Kho lưu trữ Model Registry</text>
    <text x="150" y="94" font-family="Segoe UI, Arial" font-size="12" fill="#64748B" text-anchor="middle">• MinIO S3 Object Storage</text>
    <text x="150" y="114" font-family="Segoe UI, Arial" font-size="12" fill="#64748B" text-anchor="middle">• Model Versioning &amp; Checkpoints</text>
  </g>

  <!-- Arrow 4 -> 5 (Left) -->
  <path d="M 830 367 L 762 367" fill="none" stroke="#0284C7" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- STEP 5: Model Serving -->
  <g transform="translate(450, 300)" filter="url(#shadow)">
    <rect width="300" height="135" rx="12" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
    <rect x="0" y="0" width="300" height="36" rx="12" fill="#10B981"/>
    <rect x="0" y="24" width="300" height="12" fill="#10B981"/>
    <circle cx="24" cy="18" r="10" fill="#FFFFFF"/>
    <text x="24" y="23" font-family="Segoe UI, Arial" font-size="12" font-weight="bold" fill="#10B981" text-anchor="middle">5</text>
    <text x="45" y="23" font-family="Segoe UI, Arial" font-size="14" font-weight="bold" fill="#FFFFFF">MODEL SERVING</text>
    <text x="150" y="70" font-family="Segoe UI, Arial" font-size="13" font-weight="bold" fill="#0F172A" text-anchor="middle">FastAPI OCR Microservice</text>
    <text x="150" y="94" font-family="Segoe UI, Arial" font-size="12" fill="#64748B" text-anchor="middle">• Multi-stage Docker (Port 8080)</text>
    <text x="150" y="114" font-family="Segoe UI, Arial" font-size="12" fill="#64748B" text-anchor="middle">• Non-root User UID 10001 (Rootless)</text>
  </g>

  <!-- Arrow 5 -> 6 (Left) -->
  <path d="M 440 367 L 372 367" fill="none" stroke="#0284C7" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- STEP 6: Telemetry & Monitoring -->
  <g transform="translate(60, 300)" filter="url(#shadow)">
    <rect width="300" height="135" rx="12" fill="#FFFFFF" stroke="#EC4899" stroke-width="2"/>
    <rect x="0" y="0" width="300" height="36" rx="12" fill="#EC4899"/>
    <rect x="0" y="24" width="300" height="12" fill="#EC4899"/>
    <circle cx="24" cy="18" r="10" fill="#FFFFFF"/>
    <text x="24" y="23" font-family="Segoe UI, Arial" font-size="12" font-weight="bold" fill="#EC4899" text-anchor="middle">6</text>
    <text x="45" y="23" font-family="Segoe UI, Arial" font-size="14" font-weight="bold" fill="#FFFFFF">TELEMETRY &amp; ALERT</text>
    <text x="150" y="70" font-family="Segoe UI, Arial" font-size="13" font-weight="bold" fill="#0F172A" text-anchor="middle">Giám sát &amp; Cảnh báo tự động</text>
    <text x="150" y="94" font-family="Segoe UI, Arial" font-size="12" fill="#64748B" text-anchor="middle">• Prometheus TSDB (Port 9090)</text>
    <text x="150" y="114" font-family="Segoe UI, Arial" font-size="12" fill="#64748B" text-anchor="middle">• Grafana Dashboards (Port 3000)</text>
  </g>

  <!-- ================= CLOSED-LOOP FEEDBACK ARROW (6 -> 1) ================= -->
  <!-- Curve line from step 6 back up to step 1 -->
  <path d="M 60 367 C 15 367, 15 167, 50 167" fill="none" stroke="#10B981" stroke-width="3" stroke-dasharray="6,4" marker-end="url(#arrowReturn)"/>
  <rect x="10" y="248" width="85" height="32" rx="6" fill="#10B981"/>
  <text x="52" y="262" font-family="Segoe UI, Arial" font-size="10" font-weight="bold" fill="#FFFFFF" text-anchor="middle">TÁI HUẤN LUYỆN</text>
  <text x="52" y="274" font-family="Segoe UI, Arial" font-size="9" fill="#FFFFFF" text-anchor="middle">(Retraining Loop)</text>

</svg>